-- Append the hypr config directory to Lua's path search package
package.path = package.path .. ";" .. os.getenv("HOME") .. "/.config/hypr/?.lua"

----------------
--- SOURCE -----
----------------

-- Read and inject Pywal color variables dynamically
local wal_path = os.getenv("HOME") .. "/.cache/wal/colors-hyprland.conf"
local wal_file = io.open(wal_path, "r")
if wal_file then
    for line in wal_file:lines() do
        local key, val = line:match("^%s*%$(%w+)%s*=%s*(.-)%s*$")
        if key and val then
            val = val:gsub("0x", ""):gsub("rgba%((.-)%)", "%1")
            _G[key] = "rgb(" .. val .. ")"
        end
    end
    wal_file:close()
end

